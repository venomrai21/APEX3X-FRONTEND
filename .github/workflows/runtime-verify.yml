name: APEX3X Frontend Runtime Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Verify Cloudflare Pages React runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm and Playwright browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: runtime-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}-playwright-1.55.0
          restore-keys: |
            runtime-${{ runner.os }}-
      - name: Install browser test dependency
        run: npm install --no-save --prefer-offline --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for Pages deployment readiness
        run: |
          url="https://apex3x-frontend.pages.dev/"
          for attempt in $(seq 1 18); do
            status="$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)"
            if [ "$status" = "200" ]; then
              echo "Cloudflare Pages is responding with HTTP 200 on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt: Pages returned ${status:-no-response}; waiting 5s."
            sleep 5
          done
          echo "Cloudflare Pages did not become ready within 90 seconds."
          exit 1
      - name: Verify live UI
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';

          const url = 'https://apex3x-frontend.pages.dev/';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();

          const errors = [];
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
          page.on('console', message => {
            if (message.type() === 'error') errors.push(`console: ${message.text()}`);
          });
          page.on('requestfailed', request => {
            errors.push(`requestfailed: ${request.url()} — ${request.failure()?.errorText || 'unknown'}`);
          });

          const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
          if (!response || !response.ok()) {
            throw new Error(`Live Pages origin returned ${response?.status() ?? 'no response'}`);
          }

          await page.waitForTimeout(1500);

          const result = await page.evaluate(() => ({
            title: document.title,
            rootHtmlLength: document.getElementById('root')?.innerHTML.length ?? 0,
            bodyTextLength: document.body.innerText.trim().length,
            hasAppShell: Boolean(document.querySelector('#apex-main-content')),
            hasNavigation: Boolean(document.querySelector('[aria-label="Primary navigation"]')),
          }));

          console.log(JSON.stringify(result, null, 2));

          if (errors.length) {
            console.error(errors.join('\n'));
            throw new Error('Browser runtime errors detected.');
          }

          if (!result.hasAppShell || !result.hasNavigation || result.rootHtmlLength === 0 || result.bodyTextLength === 0) {
            throw new Error('React mounted without the expected APEX UI shell.');
          }

          const businessProfileNav = page.getByRole('button', { name: 'Open Business profile', exact: true });
          if (await businessProfileNav.count() === 0) {
            throw new Error('Business Profile header control was not rendered.');
          }
          await businessProfileNav.click();
          await page.waitForTimeout(500);

          const tooltip = page.locator('[role="tooltip"]').first();
          if (await tooltip.count() === 0) {
            throw new Error('Expected Business Profile info tooltip was not rendered.');
          }

          if (await tooltip.isVisible()) {
            throw new Error('Business Profile info tooltip is visible before hover.');
          }

          await tooltip.locator('..').hover();
          await tooltip.waitFor({ state: 'visible', timeout: 2000 });

          if (!(await tooltip.isVisible())) {
            throw new Error('Business Profile info tooltip did not appear on hover.');
          }

          await page.locator('body').hover({ position: { x: 10, y: 10 } });
          await tooltip.waitFor({ state: 'hidden', timeout: 2000 });

          if (await tooltip.isVisible()) {
            throw new Error('Business Profile info tooltip remained visible after hover ended.');
          }

          console.log('Business Profile tooltip hover behavior verified.');

          const sidebarBusinessProfile = page.getByRole('button', { name: 'Business Profile', exact: true }).first();
          await sidebarBusinessProfile.waitFor({ state: 'visible', timeout: 3000 });
          await sidebarBusinessProfile.click();
          await page.waitForTimeout(500);

          const businessProfileStage = page.getByRole('tab', { name: /Stage 03/i });
          await businessProfileStage.waitFor({ state: 'visible', timeout: 3000 });
          await businessProfileStage.click();
          await page.waitForTimeout(300);

          const currencyButton = page.getByRole('button', { name: 'Business Currency', exact: true });
          if (await currencyButton.count() === 0) {
            throw new Error('Global Business Currency selector was not rendered.');
          }
          await currencyButton.click();

          const currencyCountText = page.getByText(/All supported ISO \/ CLDR currencies ·/).first();
          await currencyCountText.waitFor({ state: 'visible', timeout: 2000 });
          const currencyCountMatch = (await currencyCountText.innerText()).match(/·\s*(\d+)$/);
          const currencyCount = currencyCountMatch ? Number(currencyCountMatch[1]) : 0;
          if (currencyCount < 100) {
            throw new Error(`Currency registry exposes only ${currencyCount} entries; expected broad ISO / CLDR coverage.`);
          }

          const currencySearch = page.getByRole('textbox', { name: 'Search currencies', exact: true });
          await currencySearch.fill('INR');
          const inrOption = page.getByRole('option').filter({ hasText: 'INR' }).first();
          await inrOption.waitFor({ state: 'visible', timeout: 2000 });
          console.log(`Currency registry verified with ${currencyCount} supported entries and INR search.`);

          await browser.close();
          EOF
