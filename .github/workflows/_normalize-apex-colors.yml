name: APEX3X normalize forbidden colors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize forbidden color styling
        shell: python
        run: |
          import re
          from colorsys import rgb_to_hsv
          from pathlib import Path

          roots = [Path('src'), Path('index.html'), Path('metadata.json')]
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.exists():
                  files.extend(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.ts', '.tsx', '.css', '.html', '.json', '.md'})

          replacements = [
              (r'(?P<prefix>(?:^|[-:]))text-amber-(?:50|100|200|300|400|500|600|700|800|900)(?:/\[[^\]]+\]|/[0-9]+)?', r'\g<prefix>text-[var(--text-secondary)]'),
              (r'(?P<prefix>(?:^|[-:]))bg-amber-(?:50|100|200|300|400|500|600|700|800|900)(?:/\[[^\]]+\]|/[0-9]+)?', r'\g<prefix>bg-[var(--surface-2)]'),
              (r'(?P<prefix>(?:^|[-:]))border-amber-(?:50|100|200|300|400|500|600|700|800|900)(?:/\[[^\]]+\]|/[0-9]+)?', r'\g<prefix>border-[var(--border-strong)]'),
              (r'(?P<prefix>(?:^|[-:]))ring-amber-(?:50|100|200|300|400|500|600|700|800|900)(?:/\[[^\]]+\]|/[0-9]+)?', r'\g<prefix>ring-[var(--ring-brand)]'),
              (r'(?P<prefix>(?:^|[-:]))(?:from|via|to)-amber-(?:50|100|200|300|400|500|600|700|800|900)(?:/\[[^\]]+\]|/[0-9]+)?', r'\g<prefix>from-[var(--surface)]'),
              (r'(?P<prefix>(?:^|[-:]))text-emerald-(?:300|400|500|600|700)', r'\g<prefix>text-[var(--success)]'),
              (r'(?P<prefix>(?:^|[-:]))bg-emerald-(?:50|100|200|300|400|500|600|700)', r'\g<prefix>bg-[var(--success-bg)]'),
              (r'(?P<prefix>(?:^|[-:]))border-emerald-(?:300|400|500|600|700)(?:/\[[^\]]+\]|/[0-9]+)?', r'\g<prefix>border-[var(--border-subtle)]'),
              (r'(?P<prefix>(?:^|[-:]))text-rose-(?:300|400|500|600|700)', r'\g<prefix>text-[var(--error)]'),
              (r'(?P<prefix>(?:^|[-:]))bg-rose-(?:50|100|200|300|400|500|600|700)', r'\g<prefix>bg-[var(--error-bg)]'),
              (r'(?P<prefix>(?:^|[-:]))border-rose-(?:300|400|500|600|700)(?:/\[[^\]]+\]|/[0-9]+)?', r'\g<prefix>border-[var(--border-subtle)]'),
              (r'rgba\(245,\s*158,\s*11,', 'rgba(255, 255, 255,'),
              (r'rgba\(217,\s*164,\s*65,', 'rgba(255, 255, 255,'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for pattern, replacement in replacements:
                  text = re.sub(pattern, replacement, text, flags=re.IGNORECASE)

              def neutralize_warm_hex(match):
                  value = match.group(1)
                  r, g, b = (int(value[i:i+2], 16) / 255 for i in (0, 2, 4))
                  h, s, v = rgb_to_hsv(r, g, b)
                  degrees = h * 360
                  if 30 <= degrees <= 70 and s >= 0.20:
                      return '#0A0A0C'
                  return match.group(0)

              text = re.sub(r'#([0-9a-fA-F]{6})\b', neutralize_warm_hex, text)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          forbidden_patterns = [
              r'(?i)(?:text|bg|border|ring|from|via|to|hover:text|hover:bg|hover:border|focus:border|focus:ring)-amber-',
              r'(?i)(?:text|bg|border|ring|from|via|to|hover:text|hover:bg|hover:border|focus:border|focus:ring)-gold',
              r'(?i)(?:text|bg|border|ring|from|via|to|hover:text|hover:bg|hover:border|focus:border|focus:ring)-yellow-',
              r'(?i)rgba\(245\s*,\s*158\s*,\s*11\s*,',
              r'(?i)rgba\(217\s*,\s*164\s*,\s*65\s*,',
          ]
          violations = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              for pattern in forbidden_patterns:
                  if re.search(pattern, text):
                      violations.append(f'{path}: {pattern}')
          if violations:
              print('\n'.join(violations))
              raise SystemExit('Forbidden color styling remains.')

      - name: Commit normalized UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src index.html metadata.json
          git rm .github/workflows/_normalize-apex-colors.yml
          if git diff --cached --quiet; then
            echo "No forbidden color changes required."
            exit 0
          fi
          git commit -m "fix(ui): remove forbidden amber and gold styling"
          git push origin HEAD:main
