name: APEX3X Frontend — Cloudflare Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Resolve Cloudflare Pages project
        id: project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler pages project list --json > pages-projects.json
          PROJECT_NAME="$(node -e '
            const fs=require("fs");
            const raw=JSON.parse(fs.readFileSync("pages-projects.json","utf8"));
            const items=Array.isArray(raw) ? raw : (raw.result || []);
            const hit=items.find(x=>String(x.name||"").toLowerCase()==="apex3x-frontend");
            process.stdout.write(hit ? hit.name : "");
          ')"
          if [ -z "$PROJECT_NAME" ]; then
            npx wrangler pages project create apex3x-frontend --production-branch main
            PROJECT_NAME="apex3x-frontend"
          fi
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PROJECT_NAME="${{ steps.project.outputs.project_name }}"
          npx wrangler pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$GITHUB_SHA" | tee cloudflare-deploy.log
          npx wrangler pages deployment list \
            --project-name="$PROJECT_NAME" \
            --json > cloudflare-deployments.json
          node - <<'NODE'
          const fs=require("fs");
          const raw=JSON.parse(fs.readFileSync("cloudflare-deployments.json","utf8"));
          const items=Array.isArray(raw) ? raw : (raw.result || []);
          const latest=items[0];
          const aliases=latest?.aliases || [];
          const url=aliases.find(x=>/^https?:\\/\\//.test(x)) || "";
          if(!url) throw new Error("Cloudflare deployment completed but no pages.dev alias was returned.");
          fs.writeFileSync("deployment-url.txt", url+"\\n");
          console.log("DEPLOYMENT_URL="+url);
          NODE

      - name: Publish Cloudflare URL to commit status
        if: success()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        with:
          script: |
            const fs = require('fs');
            const url = fs.readFileSync('deployment-url.txt', 'utf8').trim();
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: url,
              description: 'Cloudflare Pages production deployment',
              context: 'cloudflare/pages'
            });

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f deployment-url.txt ]; then
            echo "## Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$(cat deployment-url.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi
